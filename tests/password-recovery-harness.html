<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>パスワード再設定 合成試験</title>
  <link rel="stylesheet" href="../assets/css/app.css">
  <script>
    window.__authTestCalls = [];
    function recordAuthTestCall(call) {
      window.__authTestCalls.push(call);
      document.documentElement.dataset.authCallCount = String(window.__authTestCalls.length);
      document.documentElement.dataset.lastAuthMethod = call.method;
    }
    window.createFirebaseDb = () => {
      const testParams = new URLSearchParams(location.search);
      const existingSession = testParams.get('existingSession') === '1';
      const resetThrows = testParams.get('resetThrows') === '1';
      const auth = {
          async getSession() {
            return { data: { session: existingSession ? { user: { id: 'synthetic' } } : null }, error: null };
          },
          async signInWithPassword() {
            return { data: {}, error: null };
          },
          async resetPasswordForEmail(email, options) {
            recordAuthTestCall({ method: 'resetPasswordForEmail', email, redirectTo: options.redirectTo });
            if (resetThrows) throw new Error('synthetic network failure');
            return { data: {}, error: null };
          },
          async signOut() {
            recordAuthTestCall({ method: 'signOut' });
            return { error: null };
          }
      };
      return { auth };
    };
  </script>
</head>
<body class="theme-light app-booting login-only">
  <div id="login-screen" style="display:none;">
    <div class="login-bg">
      <div class="login-card">
        <div class="login-logo">
          <div class="licon">📋</div>
          <h1>派遣・従業員管理システム</h1>
          <p>KAKUZEN</p>
        </div>
        <form id="login-form" onsubmit="event.preventDefault();doEmailLogin();">
          <div class="form-group">
            <label class="form-label" for="login-email">メールアドレス</label>
            <input type="email" class="form-input" id="login-email" autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="login-pw">パスワード</label>
            <input type="password" class="form-input" id="login-pw" autocomplete="current-password">
          </div>
          <div id="login-err" class="auth-message auth-message-error" role="alert" hidden></div>
          <div id="login-status" class="auth-message" role="status" hidden></div>
          <button type="submit" class="btn btn-primary" id="login-btn">ログイン</button>
          <button type="button" class="login-link" onclick="showPasswordResetRequest()">パスワードをお忘れですか？</button>
        </form>
        <form id="reset-request-form" onsubmit="event.preventDefault();requestPasswordReset();" hidden>
          <p class="login-help">登録済みのメールアドレスへ、パスワード再設定用のリンクを送ります。</p>
          <div class="form-group">
            <label class="form-label" for="reset-email">メールアドレス</label>
            <input type="email" class="form-input" id="reset-email" autocomplete="email" required>
          </div>
          <div id="reset-request-message" class="auth-message" role="status" hidden></div>
          <button type="submit" class="btn btn-primary" id="reset-request-btn">再設定メールを送る</button>
          <button type="button" class="login-link" onclick="showLoginForm()">ログイン画面に戻る</button>
        </form>
      </div>
    </div>
  </div>
  <script src="../assets/js/core.js"></script>
  <script>checkLogin();</script>
</body>
</html>
