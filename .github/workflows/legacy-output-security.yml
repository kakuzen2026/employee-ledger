name: Legacy Supabase output checks

on:
  push:
    branches: [codex/security-supabase-legacy-output-20261023]
  pull_request:
    branches: [codex/baseline-supabase-legacy-20261023]
    paths:
      - 'assets/js/**'
      - 'tests/legacy-output-security.test.cjs'
      - '.github/workflows/legacy-output-security.yml'

permissions:
  contents: read

jobs:
  synthetic-output:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Synthetic import, display, document and CSV regressions
        run: env -i PATH="$PATH" node --test tests/legacy-output-security.test.cjs
